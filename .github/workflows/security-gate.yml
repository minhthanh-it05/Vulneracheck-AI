name: Security Gate (VulneraCheck-AI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast-scan:
    name: Run VulneraCheck Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 = full history. Needed for --diff (git diff
          # between the PR base SHA and head SHA) — GitHub Actions defaults
          # to a shallow clone (depth 1), which isn't enough to diff against base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run VulneraCheck scan
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vulneracheck scan --diff "${{ github.event.pull_request.base.sha }}..${{ github.sha }}" --output vulneracheck-report.sarif.json
          else
            vulneracheck scan --path . --output vulneracheck-report.sarif.json
          fi
          if [ -f vulneracheck-report.sarif.json ] && grep -q '"status": "partial"' vulneracheck-report.sarif.json; then
            echo "::warning::Pipeline is not fully implemented yet - this is NOT a real security scan result, just a placeholder."
          fi

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('vulneracheck-report.sarif.json') != ''
        with:
          sarif_file: vulneracheck-report.sarif.json

      - name: Archive SARIF artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('vulneracheck-report.sarif.json') != ''
        with:
          name: vulneracheck-sarif-report
          path: vulneracheck-report.sarif.json
