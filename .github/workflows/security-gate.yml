name: Security Gate (VulneraCheck-AI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast-scan:
    name: Run VulneraCheck Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run VulneraCheck scan
        continue-on-error: true
        run: |
          vulneracheck scan --path . --threshold 0.85 --output vulneracheck-report.sarif.json
          if [ -f vulneracheck-report.sarif.json ] && grep -q '"status": "partial"' vulneracheck-report.sarif.json; then
            echo "::warning::Pipeline chua implement day du - day KHONG phai ket qua quet bao mat that, chi la placeholder."
          fi

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('vulneracheck-report.sarif.json') != ''
        with:
          sarif_file: vulneracheck-report.sarif.json

      - name: Archive SARIF artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('vulneracheck-report.sarif.json') != ''
        with:
          name: vulneracheck-sarif-report
          path: vulneracheck-report.sarif.json
