[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulneracheck"
version = "0.1.0"
description = "Hybrid SAST Engine — cascade 3-layer detector (regex secrets + Tree-sitter AST + GraphCodeBERT ONNX verifier) with SARIF reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "onnxruntime~=1.29.0",
    "tree-sitter~=0.26.0",
    "tree-sitter-c~=0.24.2",
    "tree-sitter-cpp~=0.23.4",
    "tree-sitter-java~=0.23.5",
    "tree-sitter-python~=0.25.0",
    "transformers~=5.15.0",
    "numpy~=2.4.6",
    "sarif-om~=1.0.4",
    "jschema-to-python~=1.2.3",
    "click~=8.4.2",
    "colorama~=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest~=9.1.1"]

[project.scripts]
vulneracheck = "vulneracheck.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
